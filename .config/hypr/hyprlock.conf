# ─── hyprlock: tela de bloqueio ─────────────────────────────
# Cor do neon (gerada pela roda de cores: ~/.config/neon/apply.sh)
source = ~/.config/hypr/neon.conf

$bg       = rgb(000000)
$border   = $neon
$text     = $neon
$text_dim = $neon_dim
$accent   = $neon_faint
$glow     = $neon_glow
$font     = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

# Hora
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 64
    font_family = $font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $glow
    position = 0, 140
    halign = center
    valign = center
}

# Data (segue o locale do sistema)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $text_dim
    font_size = 14
    font_family = $font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $glow
    position = 0, 70
    halign = center
    valign = center
}

# Usuário atual (apenas exibição)
label {
    monitor =
    text = 󰀄  $USER
    color = $text
    font_size = 13
    font_family = $font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $glow
    position = 0, 15
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = $border
    inner_color = $bg
    font_color = $text
    check_color = $text
    fail_color = $accent
    fade_on_empty = false
    placeholder_text = 󰌾
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $glow
    position = 0, -45
    halign = center
    valign = center
}