# Colors, generated in the neon color by ~/.config/neon/apply.sh
include neon.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 14

cursor_shape          block
cursor_blink_interval 0.5
# The cursor leaves a short neon trail when it jumps (kitty 0.37+)
cursor_trail       3
cursor_trail_decay 0.1 0.4

# Hide the mouse while typing
mouse_hide_wait -1

# Tabs (ctrl+shift+t) in the same flat style as the rest of the theme
tab_bar_edge        top
tab_bar_style       separator
tab_separator       ""
tab_title_template  " {index} {title} "
tab_bar_margin_height 0 6

enable_audio_bell       no
confirm_os_window_close 0
update_check_interval   0
