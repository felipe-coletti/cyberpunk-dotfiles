	{ name = "py", text = "" },
	{ name = "js", text = "" },
	{ name = "ts", text = "" },
	{ name = "json", text = "" },
	{ name = "toml", text = "" },
	{ name = "conf", text = "" },
	{ name = "css", text = "" },
	{ name = "html", text = "" },
	{ name = "qml", text = "" },
	{ name = "rs", text = "" },
	{ name = "c", text = "" },
	{ name = "go", text = "" },
	{ name = "png", text = "" },
	{ name = "jpg", text = "" },
	{ name = "gif", text = "" },
	{ name = "svg", text = "󰜡" },
	{ name = "mp3", text = "" },
	{ name = "flac", text = "" },
	{ name = "mp4", text = "" },
